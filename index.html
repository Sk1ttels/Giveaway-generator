<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Giveaway Winner Picker</title>
  <style>
    :root {
      --bg-dark: #0a0e1a;
      --bg-card: #151b2e;
      --text: #e9eeff;
      --text-muted: #a8b1d6;
      --accent: #5eead4;
      --accent-glow: rgba(94, 234, 212, 0.3);
      --success: #22c55e;
      --border: rgba(255,255,255,.1);
    }
    
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    
    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: linear-gradient(135deg, #0a0e1a 0%, #1a1f35 100%);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    
    .container {
      width: 100%;
      max-width: 600px;
    }
    
    .header {
      text-align: center;
      margin-bottom: 40px;
    }
    
    .logo {
      font-size: 64px;
      margin-bottom: 16px;
      animation: float 3s ease-in-out infinite;
    }
    
    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-10px); }
    }
    
    h1 {
      font-size: 32px;
      font-weight: 800;
      background: linear-gradient(135deg, var(--accent), var(--success));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      margin-bottom: 8px;
    }
    
    .subtitle {
      color: var(--text-muted);
      font-size: 14px;
    }
    
    .card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 24px;
      padding: 32px;
      margin-bottom: 20px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
    }
    
    .winner-display {
      text-align: center;
      padding: 60px 20px;
      background: linear-gradient(135deg, rgba(94, 234, 212, 0.1), rgba(34, 197, 94, 0.1));
      border: 2px solid var(--accent);
      border-radius: 20px;
      margin-bottom: 32px;
      position: relative;
      overflow: hidden;
      min-height: 250px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }
    
    .winner-display::before {
      content: '';
      position: absolute;
      top: -50%;
      left: -50%;
      width: 200%;
      height: 200%;
      background: radial-gradient(circle, var(--accent-glow) 0%, transparent 70%);
      animation: pulse 4s ease-in-out infinite;
    }
    
    @keyframes pulse {
      0%, 100% { opacity: 0.3; transform: scale(1) rotate(0deg); }
      50% { opacity: 0.6; transform: scale(1.1) rotate(180deg); }
    }
    
    .winner-label {
      font-size: 12px;
      font-weight: 700;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 2px;
      margin-bottom: 20px;
      position: relative;
      z-index: 1;
    }
    
    .winner-value {
      font-size: 72px;
      font-weight: 900;
      color: var(--accent);
      text-shadow: 0 0 40px var(--accent-glow);
      position: relative;
      z-index: 1;
      line-height: 1;
      margin-bottom: 12px;
    }
    
    .winner-name {
      font-size: 32px;
      font-weight: 700;
      color: var(--text);
      position: relative;
      z-index: 1;
      margin-top: 16px;
    }
    
    .placeholder {
      opacity: 0.2;
      font-size: 80px;
    }
    
    .form-group {
      margin-bottom: 24px;
    }
    
    label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      color: var(--text);
      margin-bottom: 8px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    
    .input-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }
    
    input, textarea {
      width: 100%;
      background: #0d1426;
      border: 2px solid var(--border);
      border-radius: 12px;
      padding: 14px 16px;
      color: var(--text);
      font-size: 15px;
      outline: none;
      transition: all 0.3s;
    }
    
    input:focus, textarea:focus {
      border-color: var(--accent);
      background: #0f1629;
      box-shadow: 0 0 0 3px rgba(94, 234, 212, 0.1);
    }
    
    textarea {
      min-height: 140px;
      resize: vertical;
      font-family: 'Courier New', monospace;
      line-height: 1.6;
    }
    
    .hint {
      font-size: 12px;
      color: var(--text-muted);
      margin-top: 6px;
    }
    
    .btn {
      width: 100%;
      padding: 18px 24px;
      border: none;
      border-radius: 12px;
      font-size: 16px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 1px;
      cursor: pointer;
      transition: all 0.3s;
      position: relative;
      overflow: hidden;
    }
    
    .btn-primary {
      background: linear-gradient(135deg, var(--success), var(--accent));
      color: #0a0e1a;
      box-shadow: 0 8px 25px var(--accent-glow);
    }
    
    .btn-primary:hover {
      transform: translateY(-2px);
      box-shadow: 0 12px 35px var(--accent-glow);
    }
    
    .btn-primary:active {
      transform: translateY(0);
    }
    
    .btn-secondary {
      background: transparent;
      border: 2px solid var(--border);
      color: var(--text);
      margin-top: 12px;
    }
    
    .btn-secondary:hover {
      border-color: var(--accent);
      background: rgba(94, 234, 212, 0.05);
    }
    
    .divider {
      text-align: center;
      color: var(--text-muted);
      font-weight: 600;
      font-size: 13px;
      margin: 24px 0;
      position: relative;
    }
    
    .divider::before,
    .divider::after {
      content: '';
      position: absolute;
      top: 50%;
      width: 40%;
      height: 1px;
      background: var(--border);
    }
    
    .divider::before {
      left: 0;
    }
    
    .divider::after {
      right: 0;
    }
    
    @media (max-width: 640px) {
      .container {
        padding: 0;
      }
      
      .card {
        padding: 24px;
      }
      
      .winner-value {
        font-size: 56px;
      }
      
      .winner-name {
        font-size: 24px;
      }
      
      h1 {
        font-size: 28px;
      }
    }
  </style>
</head>

<body>
  <div class="container">
    <div class="header">
      <div class="logo">🎁</div>
      <h1>Winner Picker</h1>
      <p class="subtitle">Fair and transparent giveaway selection</p>
    </div>

    <div class="card">
      <div class="winner-display">
        <div class="winner-label">🏆 Winner</div>
        <div id="winnerMain" class="winner-value placeholder">?</div>
        <div id="winnerName" class="winner-name" style="display:none;"></div>
      </div>

      <div class="form-group">
        <label>🔢 Number Range</label>
        <div class="input-row">
          <input id="min" type="number" value="1" placeholder="From" />
          <input id="max" type="number" value="100" placeholder="To" />
        </div>
        <div class="hint">Pick a random number between min and max</div>
      </div>

      <div class="divider">OR</div>

      <div class="form-group">
        <label>👥 Participant List</label>
        <textarea id="names" placeholder="Enter each participant on a new line:

@john_doe
@jane_smith
@alex_2024
@mike_wilson

You can use usernames, names, or ticket numbers"></textarea>
        <div class="hint">One participant per line</div>
      </div>

      <button id="btnPick" class="btn btn-primary">
        🎯 Pick Winner
      </button>
      
      <button id="btnCopy" class="btn btn-secondary">
        📋 Copy Result
      </button>
    </div>
  </div>

<script>
  const el = (id) => document.getElementById(id);

  const minEl = el("min");
  const maxEl = el("max");
  const namesEl = el("names");
  const winnerMain = el("winnerMain");
  const winnerName = el("winnerName");

  // Seeded random number generator
  function xmur3(str) {
    let h = 1779033703 ^ str.length;
    for (let i = 0; i < str.length; i++) {
      h = Math.imul(h ^ str.charCodeAt(i), 3432918353);
      h = (h << 13) | (h >>> 19);
    }
    return function() {
      h = Math.imul(h ^ (h >>> 16), 2246822507);
      h = Math.imul(h ^ (h >>> 13), 3266489909);
      return (h ^= h >>> 16) >>> 0;
    };
  }

  function mulberry32(a) {
    return function() {
      let t = a += 0x6D2B79F5;
      t = Math.imul(t ^ (t >>> 15), t | 1);
      t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  function randInt(min, max, rng) {
    return Math.floor(rng() * (max - min + 1)) + min;
  }

  function getNames() {
    return namesEl.value
      .split("\n")
      .map(s => s.trim())
      .filter(Boolean);
  }

  function animateWinner() {
    winnerMain.style.opacity = '0';
    winnerMain.style.transform = 'scale(0.8)';
    
    setTimeout(() => {
      winnerMain.style.transition = 'all 0.5s cubic-bezier(0.34, 1.56, 0.64, 1)';
      winnerMain.style.opacity = '1';
      winnerMain.style.transform = 'scale(1)';
    }, 100);
  }

  // Copy winner to clipboard
  el("btnCopy").addEventListener("click", async () => {
    const mainText = winnerMain.textContent;
    if (mainText === '?' || mainText === '—') {
      alert("Please pick a winner first!");
      return;
    }
    
    const nameText = winnerName.style.display !== "none" ? winnerName.textContent : '';
    const text = nameText ? `${mainText} ${nameText}` : mainText;
    
    try {
      await navigator.clipboard.writeText(text);
      
      // Visual feedback
      const btn = el("btnCopy");
      const originalText = btn.textContent;
      btn.textContent = "✅ Copied!";
      btn.style.borderColor = "var(--success)";
      btn.style.color = "var(--success)";
      
      setTimeout(() => {
        btn.textContent = originalText;
        btn.style.borderColor = "";
        btn.style.color = "";
      }, 2000);
    } catch {
      alert("Could not copy to clipboard");
    }
  });

  // Main pick function
  el("btnPick").addEventListener("click", () => {
    const names = getNames();
    const min = Number(minEl.value);
    const max = Number(maxEl.value);

    // Pick from list
    if (names.length > 0) {
      const seedText = "seed-" + Date.now();
      const seedFn = xmur3(seedText);
      const rng = mulberry32(seedFn());
      const idx = randInt(0, names.length - 1, rng);
      const picked = names[idx];

      winnerMain.textContent = "🎉";
      winnerMain.classList.remove('placeholder');
      winnerName.style.display = "block";
      winnerName.textContent = picked;
      
      animateWinner();
      return;
    }

    // Pick number
    if (!Number.isFinite(min) || !Number.isFinite(max) || min > max) {
      alert("Please check your number range (min should be ≤ max)");
      return;
    }
    
    const seedText = "seed-" + Date.now();
    const seedFn = xmur3(seedText);
    const rng = mulberry32(seedFn());
    const num = randInt(min, max, rng);

    winnerMain.textContent = String(num);
    winnerMain.classList.remove('placeholder');
    winnerName.style.display = "none";
    
    animateWinner();
  });
</script>
</body>
</html>
