<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Giveaway Winner Picker</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800;900&display=swap');
    
    :root {
      --primary: #00d4ff;
      --secondary: #7c3aed;
      --accent: #10b981;
      --text: #f0f9ff;
      --text-muted: #94a3b8;
      --bg-dark: #0a0f1e;
      --bg-card: rgba(15, 23, 42, 0.7);
      --glow-primary: rgba(0, 212, 255, 0.5);
      --glow-secondary: rgba(124, 58, 237, 0.5);
      --glow-accent: rgba(16, 185, 129, 0.5);
    }
    
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    
    body {
      font-family: 'Poppins', sans-serif;
      background: #0a0f1e;
      color: var(--text);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      position: relative;
      overflow-x: hidden;
    }
    
    /* Animated background */
    body::before {
      content: '';
      position: fixed;
      top: -50%;
      left: -50%;
      width: 200%;
      height: 200%;
      background: 
        radial-gradient(circle at 20% 50%, rgba(124, 58, 237, 0.15) 0%, transparent 50%),
        radial-gradient(circle at 80% 80%, rgba(0, 212, 255, 0.15) 0%, transparent 50%),
        radial-gradient(circle at 40% 20%, rgba(16, 185, 129, 0.1) 0%, transparent 50%);
      animation: backgroundMove 20s ease infinite;
      z-index: -1;
    }
    
    @keyframes backgroundMove {
      0%, 100% { transform: translate(0, 0) rotate(0deg); }
      33% { transform: translate(5%, -5%) rotate(120deg); }
      66% { transform: translate(-5%, 5%) rotate(240deg); }
    }
    
    /* Floating particles */
    .particle {
      position: fixed;
      width: 3px;
      height: 3px;
      background: var(--primary);
      border-radius: 50%;
      opacity: 0.3;
      animation: float 15s infinite;
      z-index: -1;
    }
    
    @keyframes float {
      0%, 100% { transform: translateY(0) translateX(0); opacity: 0; }
      10% { opacity: 0.3; }
      90% { opacity: 0.3; }
      100% { transform: translateY(-100vh) translateX(100px); opacity: 0; }
    }
    
    .container {
      width: 100%;
      max-width: 650px;
      position: relative;
      z-index: 1;
    }
    
    .header {
      text-align: center;
      margin-bottom: 50px;
      position: relative;
    }
    
    .logo {
      font-size: 80px;
      margin-bottom: 20px;
      display: inline-block;
      animation: logoFloat 3s ease-in-out infinite;
      filter: drop-shadow(0 0 20px var(--glow-primary));
    }
    
    @keyframes logoFloat {
      0%, 100% { transform: translateY(0) rotate(-5deg); }
      50% { transform: translateY(-15px) rotate(5deg); }
    }
    
    h1 {
      font-size: 42px;
      font-weight: 900;
      background: linear-gradient(135deg, var(--primary), var(--secondary), var(--accent));
      background-size: 200% 200%;
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      margin-bottom: 12px;
      animation: gradientShift 5s ease infinite;
      letter-spacing: -1px;
    }
    
    @keyframes gradientShift {
      0%, 100% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
    }
    
    .subtitle {
      color: var(--text-muted);
      font-size: 15px;
      font-weight: 500;
      letter-spacing: 0.5px;
    }
    
    .card {
      background: var(--bg-card);
      backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 30px;
      padding: 40px;
      box-shadow: 
        0 20px 60px rgba(0, 0, 0, 0.5),
        inset 0 1px 0 rgba(255, 255, 255, 0.1);
      position: relative;
      overflow: hidden;
    }
    
    .card::before {
      content: '';
      position: absolute;
      top: 0;
      left: -100%;
      width: 100%;
      height: 100%;
      background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.03), transparent);
      animation: shimmer 3s infinite;
    }
    
    @keyframes shimmer {
      0% { left: -100%; }
      100% { left: 100%; }
    }
    
    .winner-display {
      text-align: center;
      padding: 70px 30px;
      background: linear-gradient(135deg, rgba(0, 212, 255, 0.1), rgba(124, 58, 237, 0.1));
      border: 2px solid transparent;
      background-clip: padding-box;
      border-radius: 25px;
      margin-bottom: 40px;
      position: relative;
      overflow: hidden;
      min-height: 280px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }
    
    .winner-display::before {
      content: '';
      position: absolute;
      inset: -2px;
      background: linear-gradient(135deg, var(--primary), var(--secondary), var(--accent));
      border-radius: 25px;
      z-index: -1;
      opacity: 0.5;
      animation: borderRotate 3s linear infinite;
    }
    
    @keyframes borderRotate {
      0% { filter: hue-rotate(0deg); }
      100% { filter: hue-rotate(360deg); }
    }
    
    .winner-display::after {
      content: '';
      position: absolute;
      top: -50%;
      left: -50%;
      width: 200%;
      height: 200%;
      background: 
        radial-gradient(circle, var(--glow-primary) 0%, transparent 40%),
        radial-gradient(circle, var(--glow-secondary) 0%, transparent 40%);
      animation: glowPulse 4s ease-in-out infinite;
      opacity: 0.3;
    }
    
    @keyframes glowPulse {
      0%, 100% { 
        transform: translate(0, 0) scale(1);
        opacity: 0.2;
      }
      50% { 
        transform: translate(10%, 10%) scale(1.2);
        opacity: 0.4;
      }
    }
    
    .winner-label {
      font-size: 13px;
      font-weight: 700;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 3px;
      margin-bottom: 25px;
      position: relative;
      z-index: 1;
    }
    
    .winner-value {
      font-size: 85px;
      font-weight: 900;
      background: linear-gradient(135deg, var(--primary), var(--accent));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      position: relative;
      z-index: 1;
      line-height: 1;
      margin-bottom: 0;
      filter: drop-shadow(0 0 30px var(--glow-primary));
      font-variant-numeric: tabular-nums;
    }
    
    .winner-name {
      font-size: 36px;
      font-weight: 700;
      color: var(--text);
      position: relative;
      z-index: 1;
      margin-top: 20px;
      word-break: break-word;
      text-shadow: 0 0 20px rgba(0, 212, 255, 0.5);
    }
    
    .placeholder {
      opacity: 0.2;
      font-size: 100px;
      animation: placeholderPulse 2s ease-in-out infinite;
    }
    
    @keyframes placeholderPulse {
      0%, 100% { opacity: 0.2; transform: scale(1); }
      50% { opacity: 0.3; transform: scale(1.05); }
    }
    
    .form-group {
      margin-bottom: 32px;
      position: relative;
    }
    
    .form-group-inner {
      padding: 24px;
      background: rgba(15, 23, 42, 0.5);
      backdrop-filter: blur(10px);
      border-radius: 20px;
      border: 1px solid rgba(255, 255, 255, 0.05);
      transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
      position: relative;
      overflow: hidden;
    }
    
    .form-group-inner::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 2px;
      background: linear-gradient(90deg, transparent, var(--primary), transparent);
      opacity: 0;
      transition: opacity 0.4s;
    }
    
    .form-group-inner:hover {
      background: rgba(15, 23, 42, 0.7);
      border-color: rgba(0, 212, 255, 0.3);
      transform: translateY(-2px);
      box-shadow: 0 10px 30px rgba(0, 212, 255, 0.1);
    }
    
    .form-group-inner:hover::before {
      opacity: 1;
    }
    
    label {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 15px;
      font-weight: 700;
      color: var(--text);
      margin-bottom: 16px;
      letter-spacing: 0.5px;
    }
    
    label .emoji {
      font-size: 24px;
      filter: drop-shadow(0 2px 8px rgba(0, 212, 255, 0.5));
      animation: emojiFloat 3s ease-in-out infinite;
    }
    
    @keyframes emojiFloat {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-5px); }
    }
    
    .input-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
    }
    
    .input-wrapper {
      position: relative;
    }
    
    .input-label {
      position: absolute;
      top: -10px;
      left: 16px;
      background: linear-gradient(135deg, var(--primary), var(--secondary));
      padding: 4px 12px;
      font-size: 11px;
      font-weight: 700;
      color: #0a0f1e;
      text-transform: uppercase;
      letter-spacing: 1px;
      border-radius: 8px;
      z-index: 1;
      box-shadow: 0 4px 10px rgba(0, 212, 255, 0.3);
    }
    
    input, textarea {
      width: 100%;
      background: rgba(10, 15, 30, 0.6);
      border: 2px solid rgba(255, 255, 255, 0.1);
      border-radius: 16px;
      padding: 18px 20px;
      color: var(--text);
      font-size: 16px;
      font-weight: 500;
      outline: none;
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      font-family: 'Poppins', sans-serif;
    }
    
    input:focus, textarea:focus {
      border-color: var(--primary);
      background: rgba(10, 15, 30, 0.9);
      box-shadow: 
        0 0 0 4px rgba(0, 212, 255, 0.1),
        0 8px 20px rgba(0, 212, 255, 0.2);
      transform: translateY(-2px);
    }
    
    input::placeholder, textarea::placeholder {
      color: rgba(148, 163, 184, 0.5);
      font-weight: 400;
    }
    
    textarea {
      min-height: 180px;
      resize: vertical;
      font-family: 'Courier New', monospace;
      line-height: 1.8;
      font-size: 15px;
    }
    
    .hint {
      font-size: 12px;
      color: var(--text-muted);
      margin-top: 12px;
      line-height: 1.6;
      display: flex;
      align-items: center;
      gap: 8px;
      font-weight: 500;
    }
    
    .hint::before {
      content: '✨';
      font-size: 16px;
      animation: sparkle 2s ease-in-out infinite;
    }
    
    @keyframes sparkle {
      0%, 100% { opacity: 0.5; transform: scale(1); }
      50% { opacity: 1; transform: scale(1.2); }
    }
    
    .btn {
      width: 100%;
      padding: 22px 32px;
      border: none;
      border-radius: 18px;
      font-size: 17px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      cursor: pointer;
      transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
      position: relative;
      overflow: hidden;
      font-family: 'Poppins', sans-serif;
    }
    
    .btn::before {
      content: '';
      position: absolute;
      top: 50%;
      left: 50%;
      width: 0;
      height: 0;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.3);
      transform: translate(-50%, -50%);
      transition: width 0.6s, height 0.6s;
    }
    
    .btn:active::before {
      width: 400px;
      height: 400px;
    }
    
    .btn-primary {
      background: linear-gradient(135deg, var(--primary), var(--secondary));
      color: #ffffff;
      box-shadow: 
        0 15px 35px rgba(0, 212, 255, 0.4),
        inset 0 1px 0 rgba(255, 255, 255, 0.3);
      position: relative;
    }
    
    .btn-primary::after {
      content: '✨';
      position: absolute;
      right: 30px;
      top: 50%;
      transform: translateY(-50%);
      font-size: 20px;
      opacity: 0.8;
    }
    
    .btn-primary:hover {
      transform: translateY(-4px);
      box-shadow: 
        0 20px 45px rgba(0, 212, 255, 0.5),
        inset 0 1px 0 rgba(255, 255, 255, 0.3);
      background: linear-gradient(135deg, var(--secondary), var(--accent));
    }
    
    .btn-primary:active {
      transform: translateY(-2px);
    }
    
    .btn-secondary {
      background: rgba(255, 255, 255, 0.05);
      backdrop-filter: blur(10px);
      border: 2px solid rgba(255, 255, 255, 0.1);
      color: var(--text);
      margin-top: 16px;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.3);
    }
    
    .btn-secondary:hover {
      border-color: var(--primary);
      background: rgba(0, 212, 255, 0.1);
      transform: translateY(-3px);
      box-shadow: 0 12px 30px rgba(0, 212, 255, 0.3);
    }
    
    .btn-secondary:active {
      transform: translateY(-1px);
    }
    
    .divider {
      text-align: center;
      color: var(--text-muted);
      font-weight: 700;
      font-size: 13px;
      margin: 40px 0;
      position: relative;
      text-transform: uppercase;
      letter-spacing: 3px;
    }
    
    .divider span {
      background: var(--bg-card);
      padding: 0 25px;
      position: relative;
      z-index: 1;
      display: inline-block;
    }
    
    .divider::before {
      content: '';
      position: absolute;
      top: 50%;
      left: 0;
      right: 0;
      height: 2px;
      background: linear-gradient(
        90deg, 
        transparent, 
        rgba(0, 212, 255, 0.3) 25%, 
        rgba(124, 58, 237, 0.3) 50%, 
        rgba(16, 185, 129, 0.3) 75%, 
        transparent
      );
    }
    
    @media (max-width: 640px) {
      .container {
        padding: 0;
      }
      
      .card {
        padding: 30px 24px;
      }
      
      .winner-value {
        font-size: 64px;
      }
      
      .winner-name {
        font-size: 28px;
      }
      
      h1 {
        font-size: 36px;
      }
      
      .logo {
        font-size: 64px;
      }
      
      .btn-primary::after {
        display: none;
      }
    }
  </style>
</head>

<body>
  <!-- Floating particles -->
  <div class="particle" style="left: 10%; animation-delay: 0s;"></div>
  <div class="particle" style="left: 20%; animation-delay: 2s;"></div>
  <div class="particle" style="left: 30%; animation-delay: 4s;"></div>
  <div class="particle" style="left: 40%; animation-delay: 1s;"></div>
  <div class="particle" style="left: 50%; animation-delay: 3s;"></div>
  <div class="particle" style="left: 60%; animation-delay: 5s;"></div>
  <div class="particle" style="left: 70%; animation-delay: 2.5s;"></div>
  <div class="particle" style="left: 80%; animation-delay: 4.5s;"></div>
  <div class="particle" style="left: 90%; animation-delay: 1.5s;"></div>

  <div class="container">
    <div class="header">
      <div class="logo">🎁</div>
      <h1>Winner Picker</h1>
      <p class="subtitle">Fair & Transparent Giveaway Selection</p>
    </div>

    <div class="card">
      <div class="winner-display">
        <div class="winner-label">🏆 WINNER</div>
        <div id="winnerMain" class="winner-value placeholder">?</div>
        <div id="winnerName" class="winner-name" style="display:none;"></div>
      </div>

      <div class="form-group">
        <div class="form-group-inner">
          <label>
            <span class="emoji">🔢</span>
            Number Range
          </label>
          <div class="input-row">
            <div class="input-wrapper">
              <span class="input-label">Min</span>
              <input id="min" type="number" value="1" placeholder="1" />
            </div>
            <div class="input-wrapper">
              <span class="input-label">Max</span>
              <input id="max" type="number" value="100" placeholder="100" />
            </div>
          </div>
          <div class="hint">Pick a random number between min and max</div>
        </div>
      </div>

      <div class="divider"><span>OR</span></div>

      <div class="form-group">
        <div class="form-group-inner">
          <label>
            <span class="emoji">👥</span>
            Participant List
          </label>
          <textarea id="names" placeholder="@john_doe
@jane_smith
@alex_2024
@mike_wilson

Enter each participant on a new line..."></textarea>
          <div class="hint">One participant per line (usernames, names, or tickets)</div>
        </div>
      </div>

      <button id="btnPick" class="btn btn-primary">
        🎯 Pick Winner
      </button>
      
      <button id="btnCopy" class="btn btn-secondary">
        📋 Copy Result
      </button>
    </div>
  </div>

<script>
  const el = (id) => document.getElementById(id);

  const minEl = el("min");
  const maxEl = el("max");
  const namesEl = el("names");
  const winnerMain = el("winnerMain");
  const winnerName = el("winnerName");

  // Seeded random number generator
  function xmur3(str) {
    let h = 1779033703 ^ str.length;
    for (let i = 0; i < str.length; i++) {
      h = Math.imul(h ^ str.charCodeAt(i), 3432918353);
      h = (h << 13) | (h >>> 19);
    }
    return function() {
      h = Math.imul(h ^ (h >>> 16), 2246822507);
      h = Math.imul(h ^ (h >>> 13), 3266489909);
      return (h ^= h >>> 16) >>> 0;
    };
  }

  function mulberry32(a) {
    return function() {
      let t = a += 0x6D2B79F5;
      t = Math.imul(t ^ (t >>> 15), t | 1);
      t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  function randInt(min, max, rng) {
    return Math.floor(rng() * (max - min + 1)) + min;
  }

  function getNames() {
    return namesEl.value
      .split("\n")
      .map(s => s.trim())
      .filter(Boolean);
  }

  function animateWinner() {
    winnerMain.style.opacity = '0';
    winnerMain.style.transform = 'scale(0.8) rotate(-10deg)';
    
    setTimeout(() => {
      winnerMain.style.transition = 'all 0.6s cubic-bezier(0.34, 1.56, 0.64, 1)';
      winnerMain.style.opacity = '1';
      winnerMain.style.transform = 'scale(1) rotate(0deg)';
    }, 100);
  }

  // Copy winner to clipboard
  el("btnCopy").addEventListener("click", async () => {
    const mainText = winnerMain.textContent;
    if (mainText === '?' || mainText === '—') {
      alert("Please pick a winner first!");
      return;
    }
    
    const nameText = winnerName.style.display !== "none" ? winnerName.textContent : '';
    const text = nameText ? `${mainText} ${nameText}` : mainText;
    
    try {
      await navigator.clipboard.writeText(text);
      
      // Visual feedback
      const btn = el("btnCopy");
      const originalText = btn.innerHTML;
      btn.innerHTML = "✅ Copied!";
      btn.style.borderColor = "var(--accent)";
      btn.style.background = "rgba(16, 185, 129, 0.2)";
      
      setTimeout(() => {
        btn.innerHTML = originalText;
        btn.style.borderColor = "";
        btn.style.background = "";
      }, 2000);
    } catch {
      alert("Could not copy to clipboard");
    }
  });

  // Main pick function
  el("btnPick").addEventListener("click", () => {
    const names = getNames();
    const min = Number(minEl.value);
    const max = Number(maxEl.value);

    // Pick from list
    if (names.length > 0) {
      const seedText = "seed-" + Date.now();
      const seedFn = xmur3(seedText);
      const rng = mulberry32(seedFn());
      const idx = randInt(0, names.length - 1, rng);
      const picked = names[idx];

      // Show number (index + 1) and name
      const numberDisplay = String(idx + 1);
      winnerMain.innerHTML = numberDisplay;
      winnerMain.classList.remove('placeholder');
      winnerName.style.display = "block";
      winnerName.textContent = picked;
      
      animateWinner();
      return;
    }

    // Pick number only
    if (!Number.isFinite(min) || !Number.isFinite(max) || min > max) {
      alert("Please check your number range (min should be ≤ max)");
      return;
    }
    
    const seedText = "seed-" + Date.now();
    const seedFn = xmur3(seedText);
    const rng = mulberry32(seedFn());
    const num = randInt(min, max, rng);

    // Show just the number
    winnerMain.innerHTML = String(num);
    winnerMain.classList.remove('placeholder');
    winnerName.style.display = "none";
    
    animateWinner();
  });
</script>
</body>
</html>
